project_name: "ObjaTrack-XL Benchmark"
device: "auto"

source:
  type: "file"
  path: "data/videos/benchmark.mp4"

model:
  name: "yolov8n.pt"
  confidence_threshold: 0.25
  iou_threshold: 0.45
  input_size: [640, 640]
  half_precision: false
  warmup_iterations: 50

tracker:
  type: "bytetrack"
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  match_thresh: 0.8

visualization:
  enabled: false

output:
  save_video: false
  save_json: true
  json_path: "outputs/benchmark/results.json"
  save_csv: true
  csv_path: "outputs/benchmark/results.csv"

logging:
  level: "WARNING"
  format: "json"
  file: "logs/benchmark.log"
