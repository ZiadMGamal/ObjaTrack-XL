project_name: "ObjaTrack-XL"
device: "auto"

source:
  type: "file"
  path: "data/videos/sample.mp4"
  webcam_index: 0
  rtsp_url: ""
  buffer_size: 10
  reconnect_attempts: 3
  reconnect_delay: 2.0

model:
  name: "yolov8n.pt"
  confidence_threshold: 0.25
  iou_threshold: 0.45
  classes: null
  input_size: [640, 640]
  half_precision: false
  warmup_iterations: 5

tracker:
  type: "bytetrack"
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  match_thresh: 0.8
  with_reid: false
  max_cosine_distance: 0.2
  nn_budget: 100

visualization:
  enabled: true
  show_boxes: true
  show_labels: true
  show_confidence: true
  show_tracks: true
  show_trajectory: true
  trajectory_length: 30
  box_thickness: 2
  font_scale: 0.6
  font_thickness: 1

analytics:
  counting:
    enabled: false
    line_start: [0, 360]
    line_end: [1280, 360]
  zones:
    enabled: false
    regions: []
  speed_estimation:
    enabled: false
    pixels_per_meter: 8.0
  dwell_time:
    enabled: false
    threshold_seconds: 10.0

output:
  save_video: false
  video_path: "outputs/output.mp4"
  video_fps: 30.0
  video_codec: "mp4v"
  save_json: false
  json_path: "outputs/exports/results.json"
  save_csv: false
  csv_path: "outputs/exports/results.csv"

logging:
  level: "INFO"
  format: "console"
  file: "logs/objatrack.log"
